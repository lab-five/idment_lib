[package]
name = "idment_lib"
version = "0.1.0"
edition = "2024"

[dependencies]


chrono = { version = "0.4.40", features = ["serde"] }
config = "0.15.11"

jsonwebtoken = { version = "9.3.1", features = ["use_pem"] }
mac_address = "1.1.8"
num_cpus = "1.16.0"
once_cell = "1.21.3"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["full"] }


